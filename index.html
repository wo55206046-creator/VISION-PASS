    function getSiteBadgeStyle(site) {
      const s = (site || "").trim().toUpperCase();

          bg: "bg-amber-950/70 border-amber-600/70 text-amber-300",

        };

    function triggerScanFeedback() {
      if (navigator.vibrate) navigator.vibrate([40, 30, 80]);
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.1);
          setTimeout(() => ctx.close(), 150);
        }
      } catch (e) { }
    }

    // --- 2. 스토리지 제로 인메모리 전처리 파이프라인 ---
    function preprocessCanvas(sourceCanvas, options = { contrastStretch: true, adaptiveThreshold: true, invert: false }) {
      const width = sourceCanvas.width;
      const height = sourceCanvas.height;
      const processed = document.createElement("canvas");
      processed.width = width;
      processed.height = height;
      const ctx = processed.getContext("2d", { willReadFrequently: true });
      if (!ctx) return sourceCanvas;

      ctx.drawImage(sourceCanvas, 0, 0, width, height);
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      const totalPixels = width * height;

      // 1. Grayscale
      const gray = new Uint8Array(totalPixels);
      for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        gray[i] = Math.round(0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2]);
      }

      // 2. Min-Max Contrast Normalization (난반사 억제)
      if (options.contrastStretch) {
        const hist = new Int32Array(256);
        for (let i = 0; i < totalPixels; i++) hist[gray[i]]++;
        const lowCutoff = Math.floor(totalPixels * 0.02);
        const highCutoff = Math.floor(totalPixels * 0.98);
        let minVal = 0, maxVal = 255, accum = 0;
        for (let i = 0; i < 256; i++) {
          accum += hist[i];
          if (accum >= lowCutoff) { minVal = i; break; }
        }
        accum = 0;
        for (let i = 255; i >= 0; i--) {
          accum += hist[i];
          if (accum >= (totalPixels - highCutoff)) { maxVal = i; break; }
        }
        const range = maxVal - minVal || 1;
        for (let i = 0; i < totalPixels; i++) {
          let val = gray[i];
          if (val < minVal) val = minVal;
          if (val > maxVal) val = maxVal;
          gray[i] = Math.round(((val - minVal) * 255) / range);
        }
      }

      // 3. Adaptive Bradley-Roth Thresholding (적분 영상 기반 이진화)
      if (options.adaptiveThreshold) {
        const s = 21;
        const s2 = Math.floor(s / 2);
        const delta = 0.15;
        const intImg = new Uint32Array((width + 1) * (height + 1));
        const stride = width + 1;

        for (let y = 0; y < height; y++) {
          let rowSum = 0;
          for (let x = 0; x < width; x++) {
            rowSum += gray[y * width + x];
            intImg[(y + 1) * stride + (x + 1)] = intImg[y * stride + (x + 1)] + rowSum;
          }
        }

        for (let y = 0; y < height; y++) {
          const y1 = Math.max(0, y - s2);
          const y2 = Math.min(height - 1, y + s2);
          for (let x = 0; x < width; x++) {
            const x1 = Math.max(0, x - s2);
            const x2 = Math.min(width - 1, x + s2);
            const count = (x2 - x1 + 1) * (y2 - y1 + 1);
            const sum = intImg[(y2 + 1) * stride + (x2 + 1)] - intImg[y1 * stride + (x2 + 1)] - intImg[(y2 + 1) * stride + x1] + intImg[y1 * stride + x1];
            const threshold = (sum / count) * (1 - delta);
            gray[y * width + x] = gray[y * width + x] < threshold ? 0 : 255;
          }
        }
      }

      if (options.invert) {
        for (let i = 0; i < totalPixels; i++) gray[i] = 255 - gray[i];
      }

      for (let i = 0; i < totalPixels; i++) {
        const idx = i * 4;
        const v = gray[i];
        data[idx] = v; data[idx + 1] = v; data[idx + 2] = v; data[idx + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
      return processed;
    }

    function cropROI(canvas, roi) {
      const crop = document.createElement("canvas");
      crop.width = Math.max(1, Math.floor(roi.w));
      crop.height = Math.max(1, Math.floor(roi.h));
      const ctx = crop.getContext("2d");
      if (ctx) ctx.drawImage(canvas, roi.x, roi.y, roi.w, roi.h, 0, 0, crop.width, crop.height);
      return crop;
    }

    function disposeCanvas(canvas) {
      if (!canvas) return;
      try {
        const ctx = canvas.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.width = 1; canvas.height = 1;
      } catch (e) { }
    }

    // --- 3. 엑셀 리포트 생성기 (사진 속 「3. 시리얼 리스트」 사내 표준 양식 100% 일치 & 다중 호기 시트별 자동 매칭) ---
    async function exportToExcel(project) {
      const wb = new ExcelJS.Workbook();
      wb.creator = "WITHTECH Semiconductor Quality System";
      wb.created = new Date();

      const GRAY_HEADER_FILL = { type: "pattern", pattern: "solid", fgColor: { argb: "FFE2E8F0" } };
      const SUMMARY_HEADER_FILL = { type: "pattern", pattern: "solid", fgColor: { argb: "FFCBD5E1" } };
      const MODULE_BAR_FILL = { type: "pattern", pattern: "solid", fgColor: { argb: "FFD8DEE9" } };
      const THIN_BORDER = {
        top: { style: "thin", color: { argb: "FF000000" } },
        left: { style: "thin", color: { argb: "FF000000" } },
        bottom: { style: "thin", color: { argb: "FF000000" } },
        right: { style: "thin", color: { argb: "FF000000" } }
      };

      const units = project.equipmentUnits && project.equipmentUnits.length > 0
        ? project.equipmentUnits
        : [{ unitIndex: 1, equipmentSerial: "", parts: [] }];

      // 각 호기별 시트 생성 (1호기, 2호기, 3호기...)
      units.forEach(unit => {
        const sheetName = `${unit.unitIndex}호기`;

        const ws = wb.addWorksheet(sheetName, {
          views: [{ showGridLines: true }],
          pageSetup: {
            paperSize: 9, // A4
            orientation: "portrait",
            fitToPage: true,
            fitToWidth: 1,
            fitToHeight: 0
          }
        });

        // 1. 컬럼 너비 설정
        ws.columns = [
          { width: 22 }, // 품명
          { width: 20 }, // 세부 사항
          { width: 26 }, // 규격
          { width: 28 }  // Serial No.
        ];

        // 2. 대제목
        ws.mergeCells("A2:D2");
        const t = ws.getCell("A2");
        t.value = "3. 시리얼 리스트";
        t.font = { name: "Malgun Gothic", size: 16, bold: true, color: { argb: "FF000000" } };
        t.alignment = { vertical: "middle", horizontal: "center" };
        ws.getRow(2).height = 32;

        // 3. 헤더 정보 박스 (사진 서식 일치: B4 메인 모델명, B5 괄호 서브 모델명 분리)
        const eqName = (project.equipmentName || "").trim();
        let modelMain = eqName;
        let modelSub = "";

        const parenMatch = eqName.match(/^(.*?)\s*(\(.*?\))\s*$/);
        if (parenMatch) {
          modelMain = parenMatch[1].trim();
          modelSub = parenMatch[2].trim();
        }

        // A4:A5 병합: [ 모 델 명 ]
        ws.mergeCells("A4:A5");
        const mL = ws.getCell("A4");
        mL.value = "모 델 명";
        mL.font = { name: "Malgun Gothic", size: 10, bold: true };
        mL.fill = GRAY_HEADER_FILL;
        mL.alignment = { vertical: "middle", horizontal: "center" };
        mL.border = THIN_BORDER;
        ws.getCell("A5").border = THIN_BORDER;

        // B4: 메인 모델명 (예: TM100L)
        const mV1 = ws.getCell("B4");
        mV1.value = modelMain || "-";
        mV1.font = { name: "Malgun Gothic", size: 10, bold: true };
        mV1.alignment = { vertical: "middle", horizontal: "center" };
        mV1.border = THIN_BORDER;

        // B5: 괄호 세부 모델명 (예: (NaVi-TM100L-0312))
        const mV2 = ws.getCell("B5");
        mV2.value = modelSub || "";
        mV2.font = { name: "Malgun Gothic", size: 9.5, bold: true };
        mV2.alignment = { vertical: "middle", horizontal: "center" };
        mV2.border = THIN_BORDER;

        // C4, D4: [ S/N ] [ 해당 호기 시리얼 ]
        const sL = ws.getCell("C4");
        sL.value = "S/N";
        sL.font = { name: "Malgun Gothic", size: 10, bold: true };
        sL.fill = GRAY_HEADER_FILL;
        sL.alignment = { vertical: "middle", horizontal: "center" };
        sL.border = THIN_BORDER;

        const sV = ws.getCell("D4");
        sV.value = unit.equipmentSerial || "-";
        sV.font = { name: "Malgun Gothic", size: 10, bold: true };
        sV.alignment = { vertical: "middle", horizontal: "center" };
        sV.border = THIN_BORDER;

        // C5, D5: [ 작 성 자 ] [ 검사자명 ]
        const wL = ws.getCell("C5");
        wL.value = "작 성 자";
        wL.font = { name: "Malgun Gothic", size: 10, bold: true };
        wL.fill = GRAY_HEADER_FILL;
        wL.alignment = { vertical: "middle", horizontal: "center" };
        wL.border = THIN_BORDER;

        const wV = ws.getCell("D5");
        wV.value = project.inspectorName || "-";
        wV.font = { name: "Malgun Gothic", size: 10 };
        wV.alignment = { vertical: "middle", horizontal: "center" };
        wV.border = THIN_BORDER;

        ws.getRow(4).height = 20;
        ws.getRow(5).height = 20;

        // 4. 모듈별 부품 그룹 테이블 렌더링
        let r = 7;
        const categoryGroups = [];
        const partList = unit.parts || [];
        partList.forEach(part => {
          const cat = part.category || "[ MAIN ]";
          const existing = categoryGroups.find(g => g.category === cat);
          if (existing) {
            existing.parts.push(part);
          } else {
            categoryGroups.push({ category: cat, parts: [part] });
          }
        });

        categoryGroups.forEach(group => {
          // 모듈 구분 바
          ws.mergeCells(`A${r}:D${r}`);
          const modCell = ws.getCell(`A${r}`);
          modCell.value = group.category;
          modCell.font = { name: "Malgun Gothic", size: 10, bold: true, color: { argb: "FF000000" } };
          modCell.fill = MODULE_BAR_FILL;
          modCell.alignment = { vertical: "middle", horizontal: "center" };
          for (let c = 1; c <= 4; c++) ws.getRow(r).getCell(c).border = THIN_BORDER;
          ws.getRow(r).height = 22;
          r++;

          // 4개 컬럼 타이틀
          const colHeaders = ["품명", "세부 사항", "규격", "Serial No."];
          colHeaders.forEach((th, cIdx) => {
            const cell = ws.getRow(r).getCell(cIdx + 1);
            cell.value = th;
            cell.font = { name: "Malgun Gothic", size: 10, bold: true, color: { argb: "FF000000" } };
            cell.fill = GRAY_HEADER_FILL;
            cell.alignment = { vertical: "middle", horizontal: "center" };
            cell.border = THIN_BORDER;
          });
          ws.getRow(r).height = 20;
          r++;

          // 부품 목록
          const partStartRow = r;
          group.parts.forEach(p => {
            const row = ws.getRow(r);
            row.height = 19;

            const c1 = row.getCell(1);
            c1.value = p.partName;
            c1.font = { name: "Malgun Gothic", size: 9.5 };
            c1.alignment = { vertical: "middle", horizontal: "center" };
            c1.border = THIN_BORDER;

            const c2 = row.getCell(2);
            c2.value = p.subSpec || "-";
            c2.font = { name: "Malgun Gothic", size: 9.5 };
            c2.alignment = { vertical: "middle", horizontal: "center" };
            c2.border = THIN_BORDER;

            const c3 = row.getCell(3);
            c3.value = p.spec || "-";
            c3.font = { name: "Malgun Gothic", size: 9 };
            c3.alignment = { vertical: "middle", horizontal: "center" };
            c3.border = THIN_BORDER;

            const c4 = row.getCell(4);
            c4.value = p.detectedSerial || "";
            c4.font = { name: "Malgun Gothic", size: 9.5, bold: Boolean(p.detectedSerial) };
            c4.alignment = { vertical: "middle", horizontal: "center" };
            c4.border = THIN_BORDER;

            r++;
          });

          // 동일한 품명 및 세부사항 연속 행 자동 병합 (예: PC 4개 행, Control Board 2개 행)
          let pMergeStart = partStartRow;
          for (let i = 0; i < group.parts.length; i++) {
            const currP = group.parts[i];
            const nextP = i + 1 < group.parts.length ? group.parts[i + 1] : null;

            if (!nextP || nextP.partName !== currP.partName) {
              const pMergeEnd = partStartRow + i;
              if (pMergeEnd > pMergeStart) {
                ws.mergeCells(`A${pMergeStart}:A${pMergeEnd}`);
                const mergedCell = ws.getCell(`A${pMergeStart}`);
                mergedCell.alignment = { vertical: "middle", horizontal: "center" };
              }
              pMergeStart = pMergeEnd + 1;
            }
          }

          let sMergeStart = partStartRow;
          for (let i = 0; i < group.parts.length; i++) {
            const currP = group.parts[i];
            const nextP = i + 1 < group.parts.length ? group.parts[i + 1] : null;

            const isSameSub =
              Boolean(nextP) &&
              nextP.partName === currP.partName &&
              nextP.subSpec === currP.subSpec &&
              currP.subSpec !== "-";

            if (!isSameSub) {
              const sMergeEnd = partStartRow + i;
              if (sMergeEnd > sMergeStart && currP.subSpec !== "-") {
                ws.mergeCells(`B${sMergeStart}:B${sMergeEnd}`);
                const mergedCell = ws.getCell(`B${sMergeStart}`);
                mergedCell.alignment = { vertical: "middle", horizontal: "center" };
              }
              sMergeStart = sMergeEnd + 1;
            }
          }
        });

        // 5. 하단 비고 란
        const noteStartRow = r;
        const noteEndRow = r + 4;
        ws.mergeCells(`A${noteStartRow}:A${noteEndRow}`);
        const nL = ws.getCell(`A${noteStartRow}`);
        nL.value = "비 고";
        nL.font = { name: "Malgun Gothic", size: 10, bold: true };
        nL.fill = GRAY_HEADER_FILL;
        nL.alignment = { vertical: "middle", horizontal: "center" };
        for (let rowIdx = noteStartRow; rowIdx <= noteEndRow; rowIdx++) {
          ws.getRow(rowIdx).getCell(1).border = THIN_BORDER;
        }

        ws.mergeCells(`B${noteStartRow}:D${noteEndRow}`);
        const nV = ws.getCell(`B${noteStartRow}`);
        nV.value = project.notes || "";
        nV.font = { name: "Malgun Gothic", size: 9.5 };
        nV.alignment = { vertical: "top", horizontal: "left", wrapText: true };
        for (let rowIdx = noteStartRow; rowIdx <= noteEndRow; rowIdx++) {
          for (let c = 2; c <= 4; c++) {
            ws.getRow(rowIdx).getCell(c).border = THIN_BORDER;
          }
        }
      });

      const buf = await wb.xlsx.writeBuffer();
      const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      const sanitizedPjt = (project.pjtCode || "PJT").replace(/[^a-zA-Z0-9-_]/g, "_");
      const sanitizedEq = (project.equipmentName || "EQ").replace(/[^a-zA-Z0-9-_]/g, "_");
      const dateStr = (project.inspectionDate || getToday()).replace(/-/g, "");
      const fileName = `[시리얼리스트]_${sanitizedPjt}_${sanitizedEq}_(${units.length}대)_${dateStr}.xlsx`;

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // 이전 호기 시리얼 기반 자동 +1 증가 헬퍼 (예: SOTSU-SK26-1002 -> SOTSU-SK26-1003)
    function generateNextSerial(prevSerial, pjtCode = "S26-15-01", nextIndex = 1) {
      if (prevSerial && prevSerial.trim()) {
        const trimmed = prevSerial.trim();
        const match = trimmed.match(/^(.*?)(\d+)$/);
        if (match) {
          const prefix = match[1];
          const numStr = match[2];
          const nextNum = parseInt(numStr, 10) + 1;
          const paddedNextNum = String(nextNum).padStart(numStr.length, "0");
          return `${prefix}${paddedNextNum}`;
        }
      }
      return `SOTSU-SK26-100${nextIndex}`;
    }

    // 1호기 시리얼 변경 시 2호기 이후 호기 자동 연속 채번 (+1, +2...)
    function cascadeSerialFromUnit1(baseSerial, unitIndex) {
      if (unitIndex === 1) return baseSerial;
      if (!baseSerial || !baseSerial.trim()) return "";
      const trimmed = baseSerial.trim();
      const match = trimmed.match(/^(.*?)(\d+)$/);
      if (match) {
        const prefix = match[1];
        const numStr = match[2];
        const baseNum = parseInt(numStr, 10);
        const offset = unitIndex - 1;
        const nextNum = baseNum + offset;
        const padded = String(nextNum).padStart(numStr.length, "0");
        return `${prefix}${padded}`;
      }
      return `${baseSerial}-U${String(unitIndex).padStart(2, "0")}`;
    }

    // 호기 시리얼을 단일 또는 연속 범위(예: TM1L-HK26-1007 ~ TM1L-HK26-1011)로 깔끔하게 요약 표기
    function formatSerialRange(units = []) {
      if (!units || units.length === 0) return "(미입력)";
      const unit1Serial = units[0]?.equipmentSerial?.trim();
      if (!unit1Serial) return "(미입력)";

      const lastUnit = units[units.length - 1];
      let lastSerial = lastUnit?.equipmentSerial?.trim();
      if (!lastSerial && units.length > 1) {
        lastSerial = cascadeSerialFromUnit1(unit1Serial, units.length);
      }

      if (units.length <= 1 || !lastSerial || unit1Serial === lastSerial) {
        return unit1Serial;
      }

      return `${unit1Serial} ~ ${lastSerial}`;
    }

    const STORAGE_KEY = "VISION_PASS_PROJECTS_DATA_V6";

    // 로컬 스토리지 데이터 로드 헬퍼 (새로고침 F5 시에도 데이터 영구 유지 및 엑셀 기반 5개 프로젝트 자동 반영)
    function loadSavedProjects() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const isUpToDate = parsed.some(p => p.inspectorName && p.inspectorName.includes("김형태, 유병준"));
          if (isUpToDate && Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (e) {
        console.warn("Failed to load projects from localStorage", e);
      }
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_PROJECTS));
      } catch (e) { }
      return INITIAL_PROJECTS;
    }

    // --- 4. 메인 React App ---
    function App() {
      const [step, setStep] = useState(1);
      const [projects, setProjects] = useState(loadSavedProjects);
      const [currentProjectId, setCurrentProjectId] = useState(() => {

      const [formProject, setFormProject] = useState(() => {

      });
      const [isCreatingNew, setIsCreatingNew] = useState(false);

      const [activeUnit, setActiveUnit] = useState(1);
      const [ocrModalOpen, setOcrModalOpen] = useState(false);

      // 기존 등록된 프로젝트들에서 설비 담당자 목록 자동 추출 (중복 제거)
      const existingInspectors = useMemo(() => {

      // 양식 삭제
      const handleDeleteTemplate = (id, name, e) => {

      };

      // 기본 양식으로 초기화
      const handleResetTemplates = () => {
        if (confirm("모든 양식을 초기 표준 5개 모델 양식으로 복원하시겠습니까?")) {
          setPjtTemplates(PJT_MODEL_TEMPLATES);
          localStorage.removeItem(TEMPLATES_STORAGE_KEY);
        }
      };

      // 양식 저장
      const handleSaveTemplateEditor = () => {
        if (!editorModelName.trim()) {
          alert("양식 이름(모델명)을 입력해주세요.");
          return;
        }
        if (editorParts.length === 0) {
          alert("최소 1개 이상의 부품이 등록되어야 합니다.");
          return;
        }

        const moduleSet = new Set(editorParts.map(p => p.category || "[ MAIN ]"));

        if (editingTemplateData) {
          setPjtTemplates(prev =>
            prev.map(t =>
              t.id === editingTemplateData.id
                ? {

                }

          );
        } else {
          const newTpl = {
            id: `tpl-custom-${Date.now()}`,

            description: editorDescription.trim() || `${editorParts.length}개 품목 사용자 등록 양식`,
            partsCount: editorParts.length,
            moduleCount: moduleSet.size,
            parts: editorParts,
            isCustom: true
          };
          setPjtTemplates(prev => [...prev, newTpl]);
        }
        setIsTemplateEditorOpen(false);
      };

      // 에디터 안에서 엑셀 파일로 부품 파싱하여 채우기 (지능형 헤더 감지 & 컬럼 자동 매칭)
      const handleEditorExcelUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        try {
          const buffer = await file.arrayBuffer();
          let rawRows = [];
          if (typeof window !== "undefined" && window.XLSX && window.XLSX.read) {
            const u8 = new Uint8Array(buffer);
            const wb = window.XLSX.read(u8, { type: "array", cellDates: true });
            if (wb && wb.SheetNames && wb.SheetNames.length > 0) {
              const ws = wb.Sheets[wb.SheetNames[0]];
              rawRows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
            }
          }

          if (!rawRows || rawRows.length === 0) {
            const wb = new ExcelJS.Workbook();
            await wb.xlsx.load(buffer);
            const ws = wb.worksheets && wb.worksheets[0];
            if (ws) {
              ws.eachRow({ includeEmpty: false }, (row) => {
                const rowVals = [];
                for (let c = 1; c <= 12; c++) {
                  const cell = row.getCell(c);
                  rowVals.push(cell && cell.value !== null && cell.value !== undefined ? String(cell.value).trim() : "");
                }
                rawRows.push(rowVals);
              });
            }
          }

          // --- 헤더 행 및 컬럼 인덱스 자동 감지 ---
          let headerRowIdx = -1;
          let colPartName = -1;
          let colSubSpec = -1;
          let colSpec = -1;
          let colSerial = -1;

          for (let r = 0; r < Math.min(rawRows.length, 30); r++) {
            const row = (rawRows[r] || []).map(cell => String(cell || "").replace(/\s+/g, ""));
            if (row.length === 0) continue;

            const pIdx = row.findIndex(c => /^(품명|부품명|품목|partname|part|item)$/i.test(c));
            const subIdx = row.findIndex(c => /^(세부사항|세부|subspec|sub_spec|용도|위치|비고)$/i.test(c));
            const sIdx = row.findIndex(c => /^(규격|사양|spec|specification|model|모델명|모델)$/i.test(c));
            const snIdx = row.findIndex(c => /^(serialno\.?|serialnumber|serial|시리얼|s\/n|sn|일련번호)$/i.test(c));

            if (pIdx !== -1) {
              headerRowIdx = r;
              colPartName = pIdx;
              colSubSpec = subIdx;
              colSpec = sIdx;
              colSerial = snIdx;
              break;
            }
          }

          const extracted = [];
          let currentCategory = "[ MAIN ]";
          const startRow = headerRowIdx !== -1 ? headerRowIdx + 1 : 0;

          let lastPartName = "";
          let lastSubSpec = "";

          for (let r = startRow; r < rawRows.length; r++) {
            const row = rawRows[r] || [];
            if (!Array.isArray(row) || row.length === 0) continue;

            const cells = row.map(c => (c !== undefined && c !== null ? String(c).trim() : ""));
            const nonEmpty = cells.filter(c => c.length > 0);
            if (nonEmpty.length === 0) continue;

            const firstVal = nonEmpty[0] || "";

            if (
              firstVal.includes("시리얼 리스트") ||
              firstVal.includes("시리얼리스트") ||
              firstVal.includes("모 델 명") ||
              firstVal.includes("모델명") ||
              firstVal.includes("작성자") ||
              firstVal.includes("비 고") ||
              firstVal.includes("비고")
            ) {
              continue;
            }

            if (firstVal.startsWith("[") && (firstVal.endsWith("]") || nonEmpty.length === 1)) {
              currentCategory = firstVal.startsWith("[") && firstVal.endsWith("]")
                ? firstVal
                : `[ ${firstVal.replace(/[\[\]]/g, "").trim()} ]`;
              lastPartName = "";
              lastSubSpec = "";
              continue;
            }

            if (firstVal === "품명" || firstVal === "부품명" || firstVal === "Part Name") {
              continue;
            }

            let rawPartName = "";
            let rawSubSpec = "";
            let rawSpec = "";
            let rawSerial = "";

            if (headerRowIdx !== -1 && colPartName !== -1) {
              rawPartName = colPartName !== -1 && cells[colPartName] ? cells[colPartName] : "";
              rawSubSpec = colSubSpec !== -1 && cells[colSubSpec] ? cells[colSubSpec] : "";
              rawSpec = colSpec !== -1 && cells[colSpec] ? cells[colSpec] : "";
              rawSerial = colSerial !== -1 && cells[colSerial] ? cells[colSerial] : "";
            } else {
              const isCol0Number = /^\d+$/.test(cells[0] || "");
              const offset = isCol0Number ? 1 : (cells[0] ? 0 : 1);

              rawPartName = cells[offset] || "";
              rawSubSpec = cells[offset + 1] || "";
              rawSpec = cells[offset + 2] || "";
              rawSerial = cells[offset + 3] || "";
            }

            // 아무 데이터도 없는 빈 행 건너뛰기
            if (!rawPartName && !rawSubSpec && !rawSpec && !rawSerial) {
              continue;
            }

            // 🔄 엑셀 세로 병합 셀(Merged Cells) 자동 상속 처리 (예: PC, Control Board)
            let finalPartName = rawPartName;
            if (!finalPartName && (rawSubSpec || rawSpec || rawSerial) && lastPartName) {
              finalPartName = lastPartName;
            }

            let finalSubSpec = rawSubSpec;
            if (!finalSubSpec && finalPartName === lastPartName && lastSubSpec && !rawPartName) {
              finalSubSpec = lastSubSpec;
            }

            if (rawPartName) {
              lastPartName = rawPartName;
              lastSubSpec = rawSubSpec;
            }

            if (finalPartName && !finalPartName.startsWith("[")) {
              extracted.push({
                id: generateId(),
                category: currentCategory,
                partName: finalPartName,
                subSpec: finalSubSpec || "-",
                spec: rawSpec || "-",
                detectedSerial: rawSerial || "",
                isVerified: Boolean(rawSerial && rawSerial.length > 0)
              });
            }
          }

          if (extracted.length > 0) {
            setEditorParts(extracted);
            if (!editorModelName.trim()) {
              setEditorModelName(file.name.replace(/\.[^/.]+$/, ""));
            }
          }
        } catch (err) {
          alert("엑셀 파일 분석 중 오류가 발생했습니다: " + (err && err.message ? err.message : ""));
        } finally {
          if (editorFileInputRef.current) editorFileInputRef.current.value = "";
        }
      };

      const [isOcrProcessing, setIsOcrProcessing] = useState(false);
      const [ocrProgress, setOcrProgress] = useState(0);
      const [ocrCandidate, setOcrCandidate] = useState("");
      const [isVerifiedCheck, setIsVerifiedCheck] = useState(true);
      const [searchPjtFilter, setSearchPjtFilter] = useState("");

      // PJT 빠른 수정 모달 상태
      const [editPjtModalOpen, setEditPjtModalOpen] = useState(false);
      const [editingPjtData, setEditingPjtData] = useState(null);

      const videoRef = useRef(null);
      const streamRef = useRef(null);

      // 엑셀 파일 직접 업로드 분석 핸들러 (SheetJS + ExcelJS + CSV 3중 방어 파서)
      const handleExcelFileUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setExcelUploadError(null);
        setIsExcelParsing(true);
        setUploadedExcelName(file.name);

        try {
          const buffer = await file.arrayBuffer();
          let rawRows = [];

          // 1. SheetJS (가장 강력하고 오류 없는 엑셀 파서)
          if (typeof window !== "undefined" && window.XLSX && typeof window.XLSX.read === "function") {
            try {
              const u8 = new Uint8Array(buffer);
              const wb = window.XLSX.read(u8, { type: "array", cellDates: true });
              if (wb && wb.SheetNames && wb.SheetNames.length > 0) {
                const sheetName = wb.SheetNames[0];
                const ws = wb.Sheets[sheetName];
                if (ws) {
                  rawRows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
                }
              }
            } catch (xlsxErr) {
              console.warn("SheetJS parse exception:", xlsxErr);
            }
          }

          // 2. ExcelJS 백업 파서 (SheetJS 미로드 시)
          if (!rawRows || rawRows.length === 0) {
            try {
              if (typeof ExcelJS !== "undefined" && ExcelJS.Workbook) {
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(buffer);
                const worksheet = workbook.worksheets && workbook.worksheets[0];
                if (worksheet) {
                  worksheet.eachRow({ includeEmpty: false }, (row) => {
                    const rowValues = [];
                    for (let colIdx = 1; colIdx <= 10; colIdx++) {
                      try {
                        const cell = row.getCell(colIdx);
                        let valStr = "";
                        if (cell && cell.value !== null && cell.value !== undefined) {
                          if (typeof cell.value === "object") {
                            if (cell.value.result !== undefined && cell.value.result !== null) {
                              valStr = String(cell.value.result);
                            } else if (Array.isArray(cell.value.richText)) {
                              valStr = cell.value.richText.map(r => (r && r.text) ? r.text : "").join("");
                            } else if (cell.value.text !== undefined && cell.value.text !== null) {
                              valStr = String(cell.value.text);
                            } else {
                              valStr = String(cell.value || "");
                            }
                          } else {
                            valStr = String(cell.value);
                          }
                        }
                        rowValues.push(valStr.trim());
                      } catch (cErr) {
                        rowValues.push("");
                      }
                    }
                    rawRows.push(rowValues);
                  });
                }
              }
            } catch (excelJsErr) {
              console.warn("ExcelJS parse exception:", excelJsErr);
            }
          }

          // 3. CSV 텍스트 직접 파싱 백업
          if (!rawRows || rawRows.length === 0) {
            try {
              const text = new TextDecoder("utf-8").decode(buffer);
              if (text && text.includes(",")) {
                rawRows = text.split(/\r?\n/).map(line => line.split(",").map(c => c.replace(/^["']|["']$/g, "").trim()));
              }
            } catch (txtErr) {
              console.warn("CSV text parse exception:", txtErr);
            }
          }

          if (!rawRows || rawRows.length === 0) {
            throw new Error("엑셀 파일 데이터를 읽어오지 못했습니다. 파일 형식(.xlsx, .xls, .csv)을 확인해주세요.");
          }

          // 파싱된 행 데이터에서 부품 목록 지능형 추출 (헤더 감지 & 컬럼 자동 매칭)
          let headerRowIdx = -1;
          let colPartName = -1;
          let colSubSpec = -1;
          let colSpec = -1;
          let colSerial = -1;

          for (let r = 0; r < Math.min(rawRows.length, 30); r++) {
            const row = (rawRows[r] || []).map(cell => String(cell || "").replace(/\s+/g, ""));
            if (row.length === 0) continue;

            const pIdx = row.findIndex(c => /^(품명|부품명|품목|partname|part|item)$/i.test(c));
            const subIdx = row.findIndex(c => /^(세부사항|세부|subspec|sub_spec|용도|위치|비고)$/i.test(c));
            const sIdx = row.findIndex(c => /^(규격|사양|spec|specification|model|모델명|모델)$/i.test(c));
            const snIdx = row.findIndex(c => /^(serialno\.?|serialnumber|serial|시리얼|s\/n|sn|일련번호)$/i.test(c));

            if (pIdx !== -1) {
              headerRowIdx = r;
              colPartName = pIdx;
              colSubSpec = subIdx;
              colSpec = sIdx;
              colSerial = snIdx;
              break;
            }
          }

          const extractedParts = [];
          let currentCategory = "[ MAIN ]";
          const startRow = headerRowIdx !== -1 ? headerRowIdx + 1 : 0;

          let lastPartName = "";
          let lastSubSpec = "";

          for (let r = startRow; r < rawRows.length; r++) {
            const row = rawRows[r] || [];
            if (!Array.isArray(row) || row.length === 0) continue;

            const cells = row.map(c => (c !== undefined && c !== null ? String(c).trim() : ""));
            const nonEmpty = cells.filter(c => c.length > 0);
            if (nonEmpty.length === 0) continue;

            const firstVal = nonEmpty[0] || "";

            if (
              firstVal.includes("시리얼 리스트") ||
              firstVal.includes("시리얼리스트") ||
              firstVal.includes("모 델 명") ||
              firstVal.includes("모델명") ||
              firstVal.includes("작성자") ||
              firstVal.includes("비 고") ||
              firstVal.includes("비고")
            ) {
              continue;
            }

            if (firstVal.startsWith("[") && (firstVal.endsWith("]") || nonEmpty.length === 1)) {
              currentCategory = firstVal.startsWith("[") && firstVal.endsWith("]")
                ? firstVal
                : `[ ${firstVal.replace(/[\[\]]/g, "").trim()} ]`;
              lastPartName = "";
              lastSubSpec = "";
              continue;
            }

            if (firstVal === "품명" || firstVal === "부품명" || firstVal === "Part Name") {
              continue;
            }

            let rawPartName = "";
            let rawSubSpec = "";
            let rawSpec = "";
            let rawSerial = "";

            if (headerRowIdx !== -1 && colPartName !== -1) {
              rawPartName = colPartName !== -1 && cells[colPartName] ? cells[colPartName] : "";
              rawSubSpec = colSubSpec !== -1 && cells[colSubSpec] ? cells[colSubSpec] : "";
              rawSpec = colSpec !== -1 && cells[colSpec] ? cells[colSpec] : "";
              rawSerial = colSerial !== -1 && cells[colSerial] ? cells[colSerial] : "";
            } else {
              const isCol0Number = /^\d+$/.test(cells[0] || "");
              const offset = isCol0Number ? 1 : (cells[0] ? 0 : 1);

              rawPartName = cells[offset] || "";
              rawSubSpec = cells[offset + 1] || "";
              rawSpec = cells[offset + 2] || "";
              rawSerial = cells[offset + 3] || "";
            }

            // 아무 데이터도 없는 빈 행 건너뛰기
            if (!rawPartName && !rawSubSpec && !rawSpec && !rawSerial) {
              continue;
            }

            // 🔄 엑셀 세로 병합 셀(Merged Cells) 자동 상속 처리 (예: PC, Control Board)
            let finalPartName = rawPartName;
            if (!finalPartName && (rawSubSpec || rawSpec || rawSerial) && lastPartName) {
              finalPartName = lastPartName;
            }

            let finalSubSpec = rawSubSpec;
            if (!finalSubSpec && finalPartName === lastPartName && lastSubSpec && !rawPartName) {
              finalSubSpec = lastSubSpec;
            }

            if (rawPartName) {
              lastPartName = rawPartName;
              lastSubSpec = rawSubSpec;
            }

            if (finalPartName && !finalPartName.startsWith("[")) {
              extractedParts.push({
                id: generateId(),
                category: currentCategory,
                partName: finalPartName,
                subSpec: finalSubSpec || "-",
                spec: rawSpec || "-",
                detectedSerial: rawSerial || "",
                isVerified: Boolean(rawSerial && rawSerial.length > 0)
              });
            }
          }

          if (extractedParts.length === 0) {
            throw new Error("엑셀 파일에서 유효한 부품 목록을 찾을 수 없습니다. 시트 내 품명 열을 확인해 주세요.");
          }

          setParsedExcelParts(extractedParts);
        } catch (err) {
          console.error("Excel Upload Error:", err);
          setExcelUploadError(err && err.message ? err.message : "엑셀 파일 분석 중 오류가 발생했습니다.");
          setParsedExcelParts([]);
        } finally {
          setIsExcelParsing(false);
          if (excelFileInputRef.current) excelFileInputRef.current.value = "";
        }
      };

      // 프로젝트 상태 변경 시 localStorage에 실시간 자동 저장 (F5 새로고침 완벽 보존)
      useEffect(() => {
        try {
          if (projects && projects.length > 0) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
          }
        } catch (e) {
          console.warn("Failed to save projects to localStorage", e);
        }
      }, [projects]);

      // 초기 샘플 데이터로 리셋 핸들러
      const handleResetToDefault = () => {
        if (confirm("모든 데이터를 기본 초기 샘플 데이터로 복원하시겠습니까?\n(작성하신 프로젝트 및 부품 검증 내역이 초기화됩니다.)")) {
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (e) { }
          setProjects(INITIAL_PROJECTS);
          setCurrentProjectId(INITIAL_PROJECTS[0].id);
          setFormProject(JSON.parse(JSON.stringify(INITIAL_PROJECTS[0])));
          setStep(1);
        }
      };

      // 현재 활성화된 프로젝트 객체
      const currentProject = projects.find(p => p.id === currentProjectId) || projects[0];

      // 프로젝트 업데이트 헬퍼
      const updateCurrentProject = (newProjectData) => {
        setProjects(prev => prev.map(p => p.id === currentProjectId ? { ...newProjectData, updatedAt: new Date().toISOString() } : p));
      };

      // 1. 신규 PJT 등록 핸들러 (2단계로 이동, 버튼을 누를 때까지는 projects에 미등록)
      const handleCreateNewProject = () => {
        const newPjt = createNewBlankProject();
        setFormProject(newPjt);
        setIsCreatingNew(true);
        setActiveUnit(1);
        setStep(2); // 2. PJT 입력 단계로 이동
      };

      // 특정 PJT 선택 후 이동
      const handleSelectProject = (pjtId, targetStep = 3) => {
        setCurrentProjectId(pjtId);
        const target = projects.find(p => p.id === pjtId) || currentProject;
        setFormProject(JSON.parse(JSON.stringify(target)));
        setIsCreatingNew(false);
        setActiveUnit(1);
        setStep(targetStep);
      };

      // 2단계에서 [PJT 등록 및 OCR 검사] 버튼 클릭 시 정식 등록 및 3단계 이동
      const handleRegisterOrSaveProject = () => {
        if (!formProject.site || !formProject.site.trim()) {
          alert("사업장 (Site)을 입력하거나 선택해주세요.");
          return;
        }
        if (!formProject.pjtCode || !formProject.pjtCode.trim()) {
          alert("PJT CODE를 입력해주세요.");
          return;
        }
        if (!formProject.equipmentName || !formProject.equipmentName.trim()) {
          alert("프로젝트 이름 / 설비명을 입력해주세요.");
          return;
        }

        const finalProject = {
          ...formProject,
          quantity: formProject.equipmentUnits.length,
          updatedAt: new Date().toISOString()
        };

        if (isCreatingNew) {
          // 신규 프로젝트 정식 등록
          setProjects(prev => [finalProject, ...prev]);
          setCurrentProjectId(finalProject.id);
          setIsCreatingNew(false);
        } else {
          // 기존 프로젝트 수정 저장
          setProjects(prev => prev.map(p => p.id === finalProject.id ? finalProject : p));
          setCurrentProjectId(finalProject.id);
        }

        setActiveUnit(1);
        setStep(3); // 3. 설비 OCR 검사 단계로 이동
      };

      // PJT 수정 모달 열기
      const handleOpenEditPjtModal = (pjt, e) => {
        if (e) e.stopPropagation();
        setEditingPjtData(JSON.parse(JSON.stringify(pjt)));
        setEditPjtModalOpen(true);
      };

      // PJT 수정 저장
      const handleSavePjtEdit = () => {
        if (!editingPjtData) return;
        if (!editingPjtData.pjtCode.trim()) {
          alert("PJT CODE를 입력해주세요.");
          return;
        }
        if (!editingPjtData.equipmentName.trim()) {
          alert("프로젝트 설비명을 입력해주세요.");
          return;
        }

        setProjects(prev => prev.map(p => {
          if (p.id === editingPjtData.id) {
            return {
              ...editingPjtData,
              quantity: editingPjtData.equipmentUnits.length,
              updatedAt: new Date().toISOString()
            };
          }
          return p;
        }));

        setEditPjtModalOpen(false);
        setEditingPjtData(null);
      };

      // PJT 복제
      const handleDuplicateProject = (pjtId, e) => {
        if (e) e.stopPropagation();
        const target = projects.find(p => p.id === pjtId);
        if (!target) return;
        const dup = {
          ...target,
          id: generateId(),
          pjtCode: `${target.pjtCode}-COPY`,
          equipmentUnits: target.equipmentUnits.map(u => ({
            ...u,
            equipmentSerial: `${u.equipmentSerial}-COPY`,
            parts: u.parts.map(p => ({ ...p, id: generateId(), detectedSerial: "", isVerified: false }))
          })),
          updatedAt: new Date().toISOString()
        };
        setProjects(prev => [dup, ...prev]);
      };

      // PJT 삭제
      const handleDeleteProject = (pjtId, e) => {
        if (e) e.stopPropagation();
        if (projects.length <= 1) {
          alert("최소 1개 이상의 프로젝트가 유지되어야 합니다.");
          return;
        }
        if (confirm("해당 프로젝트를 목록에서 삭제하시겠습니까?")) {
          setProjects(prev => prev.filter(p => p.id !== pjtId));
          if (currentProjectId === pjtId) {
            const remaining = projects.filter(p => p.id !== pjtId);
            setCurrentProjectId(remaining[0].id);
          }
        }
      };

      // Step 2 호기 수량 변경 핸들러 (formProject 대상 - 이전 시리얼에서 +1 자동 증가)
      const handleQuantityChange = (qty) => {
        if (qty < 1 || qty > 50) return;
        const current = [...formProject.equipmentUnits];
        if (qty > current.length) {
          for (let i = current.length; i < qty; i++) {
            const nextIdx = i + 1;
            const baseParts = current[0]?.parts.map(p => ({ ...p, id: generateId(), detectedSerial: "", isVerified: false })) || [];
            const unit1Serial = current[0]?.equipmentSerial?.trim();
            const nextSerial = unit1Serial ? cascadeSerialFromUnit1(unit1Serial, nextIdx) : "";
            current.push({ unitIndex: nextIdx, equipmentSerial: nextSerial, parts: baseParts });
          }
        } else {
          current.splice(qty);
        }
        setFormProject({ ...formProject, quantity: qty, equipmentUnits: current });
      };

      // 1호기 부품 일괄 복사
      const replicateParts = () => {
        const u1Parts = currentProject.equipmentUnits[0]?.parts || [];
        const updated = currentProject.equipmentUnits.map((u, i) => {
          if (i === 0) return u;
          return {
            ...u,
            parts: u1Parts.map(p => ({ ...p, id: generateId(), detectedSerial: "", isVerified: false }))
          };
        });
        updateCurrentProject({ ...currentProject, equipmentUnits: updated });
        alert("1호기의 부품 목록이 모든 호기에 일괄 복제되었습니다.");
      };

      // 카메라 시작
      // 카메라 시작 (다단계 장애 극복 & 안드로이드 호환)
      const startCamera = async () => {
        try {
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(t => t.stop());
            streamRef.current = null;
          }

          let mediaStream = null;
          try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: "environment" }, width: { ideal: 1920, min: 640 }, height: { ideal: 1080, min: 480 } },
              audio: false
            });
          } catch (e1) {
            try {
              mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
              });
            } catch (e2) {
              mediaStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
              });
            }
          }

          if (mediaStream) {
            streamRef.current = mediaStream;
            if (videoRef.current) {
              videoRef.current.srcObject = mediaStream;
              videoRef.current.onloadedmetadata = () => {
                videoRef.current?.play().catch(e => console.warn("Auto-play error:", e));
              };
            }
          }
        } catch (e) {
          console.warn("Camera failed:", e);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        if (videoRef.current) videoRef.current.srcObject = null;
      };

      const openOcr = (part) => {
        setTargetPart(part);
        setOcrCandidate(part.detectedSerial || "");
        setIsVerifiedCheck(true);
        setOcrModalOpen(true);
        setTimeout(startCamera, 200);
      };

      const closeOcr = () => {
        stopCamera();
        setOcrModalOpen(false);
        setTargetPart(null);
      };

      // 스토리지 제로 인메모리 OCR 실행
      const runOcr = async () => {
        setIsOcrProcessing(true);
        setOcrProgress(20);

        let canvas = document.createElement("canvas");
        const video = videoRef.current;
        canvas.width = video ? video.videoWidth || 1280 : 1280;
        canvas.height = video ? video.videoHeight || 720 : 720;
        const ctx = canvas.getContext("2d");
        if (video && ctx) ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // ROI Crop & Preprocess
        const roi = cropROI(canvas, { x: canvas.width * 0.1, y: canvas.height * 0.25, w: canvas.width * 0.8, h: canvas.height * 0.5 });
        const processed = preprocessCanvas(roi);

        setOcrProgress(50);
        try {
          const worker = await Tesseract.createWorker("eng");
          await worker.setParameters({ tessedit_char_whitelist: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-_./:" });
          setOcrProgress(75);
          const ret = await worker.recognize(processed);
          await worker.terminate();

          const raw = ret.data.text || "";
          const match = raw.match(/[A-Z0-9\-_]{4,25}/g);
          const best = match ? match[0].toUpperCase() : raw.trim().toUpperCase();

          setOcrCandidate(best);
          triggerScanFeedback();
        } catch (e) {
          console.error(e);
        } finally {
          disposeCanvas(canvas);
          disposeCanvas(roi);
          disposeCanvas(processed);
          setIsOcrProcessing(false);
          setOcrProgress(100);
        }
      };

      const saveOcrResult = () => {
        if (!targetPart) return;
        const updatedUnits = currentProject.equipmentUnits.map(u => {
          if (u.unitIndex === activeUnit) {
            return {
              ...u,
              parts: u.parts.map(p => p.id === targetPart.id ? { ...p, detectedSerial: ocrCandidate, isVerified: isVerifiedCheck, scannedAt: new Date().toISOString() } : p)
            };
          }
          return u;
        });
        updateCurrentProject({ ...currentProject, equipmentUnits: updatedUnits });
        closeOcr();
      };

      const currentUnitData = currentProject.equipmentUnits.find(u => u.unitIndex === activeUnit) || currentProject.equipmentUnits[0];

      // PJT List 필터링
      const filteredProjects = projects.filter(p =>
        p.pjtCode.toLowerCase().includes(searchPjtFilter.toLowerCase()) ||
        p.equipmentName.toLowerCase().includes(searchPjtFilter.toLowerCase()) ||
        p.site.toLowerCase().includes(searchPjtFilter.toLowerCase()) ||
        p.equipmentUnits.some(u => u.equipmentSerial.toLowerCase().includes(searchPjtFilter.toLowerCase())) ||
        (p.inspectorName && p.inspectorName.toLowerCase().includes(searchPjtFilter.toLowerCase()))
      );

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-30 border-b border-slate-800 bg-slate-950/80 backdrop-blur-md px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="relative flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-tr from-cyan-400 via-cyan-500 to-blue-600 shadow-glow-cyan">
                {/* 📷 광학 카메라 렌즈 / 조리개(Aperture) SVG */}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" className="h-5 w-5 text-slate-950">
                  <circle cx="12" cy="12" r="10" />
                  <line x1="14.31" y1="8" x2="20.05" y2="17.94" />
                  <line x1="9.69" y1="8" x2="21.17" y2="8" />
                  <line x1="7.38" y1="12" x2="13.12" y2="2.06" />
                  <line x1="9.69" y1="16" x2="3.95" y2="6.06" />
                  <line x1="14.31" y1="16" x2="2.83" y2="16" />
                  <line x1="16.62" y1="12" x2="10.88" y2="21.94" />
                </svg>
                <div className="absolute -bottom-0.5 -right-0.5 h-2 w-2 rounded-full bg-emerald-400 ring-2 ring-slate-950 animate-pulse"></div>
              </div>
              <div>
                <span className="font-mono font-extrabold text-sm text-white">Serial <span className="text-cyan-400">Report</span></span>
                <span className="ml-2 rounded bg-cyan-950 px-1.5 py-0.5 text-[10px] text-cyan-300 border border-cyan-800 font-mono">OCR Pro</span>
              </div>
            </div>

            {/* Stepper (1. PJT List -> 2. PJT 입력 -> 3. 설비 OCR -> 4. 설비 부품 양식) */}
            <div className="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs">
              <button onClick={() => setStep(1)} className={`px-3 py-1.5 rounded-lg transition-all ${step === 1 ? 'bg-cyan-500 text-slate-950 font-bold shadow-glow-cyan' : 'text-slate-400 hover:text-white'}`}>1. PJT List</button>
              <button onClick={() => handleCreateNewProject()} className={`px-3 py-1.5 rounded-lg transition-all ${step === 2 ? 'bg-cyan-500 text-slate-950 font-bold shadow-glow-cyan' : 'text-slate-400 hover:text-white'}`}>2. PJT 입력</button>
              <button onClick={() => setStep(3)} className={`px-3 py-1.5 rounded-lg transition-all ${step === 3 ? 'bg-cyan-500 text-slate-950 font-bold shadow-glow-cyan' : 'text-slate-400 hover:text-white'}`}>3. 설비 OCR</button>
              <button onClick={() => setStep(4)} className={`px-3 py-1.5 rounded-lg transition-all ${step === 4 ? 'bg-cyan-500 text-slate-950 font-bold shadow-glow-cyan' : 'text-slate-400 hover:text-white'}`}>4. 설비 부품 양식</button>
            </div>

            <div className="flex items-center gap-2">
              <div className="hidden sm:flex items-center gap-1.5 bg-emerald-950/60 px-2.5 py-1 rounded-lg border border-emerald-800 text-xs text-emerald-400 shadow-sm" title="모든 PJT 등록, 수정 및 OCR 검증 내역이 브라우저 로컬 저장소에 실시간 자동 저장됩니다.">
                <span>💾 자동 저장됨</span>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

            {/* Step 1: PJT List (가로 나열 + 깔끔한 사업장 명칭) */}

                                        isVerified: false
                                      }));

                                      if (step === 2) {
                                        // 2단계 (PJT 입력): 전체 호기에 양식 부품 일괄 복제 배정 & 모델명을 해당 양식명으로 즉시 변경!
                                        const updatedUnits = formProject.equipmentUnits.map(u => ({
                                          ...u,
                                          parts: newParts.map(p => ({ ...p, id: generateId() }))
                                        }));
                                        setFormProject({
                                          ...formProject,
                                          equipmentName: tpl.modelName, // 선택한 양식명으로 즉시 변경
                                          equipmentUnits: updatedUnits
                                        });
                                      } else {
                                        // 3단계 (설비 OCR): 현재 호기 부품 교체
                                        const updated = currentProject.equipmentUnits.map(u =>
                                          u.unitIndex === activeUnit ? { ...u, parts: newParts } : u
                                        );
                                        updateCurrentProject({ ...currentProject, equipmentUnits: updated });
                                      }
                                      setPresetModalOpen(false);
                                    }}
                                    className="bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-extrabold px-4 py-2 rounded-xl shadow-glow-cyan hover:opacity-95 cursor-pointer flex items-center gap-1.5 shrink-0"
                                  >
                                    <span>✨</span>
                                    <span>이 PJT 양식으로 품명 로드</span>
                                  </button>
                                </div>
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  )}

                  {/* TAB 2: 엑셀 파일(.xlsx) 직접 업로드 */}
                  {pjtModalTab === "EXCEL" && (
                    <div className="space-y-4">
                      <input
                        ref={excelFileInputRef}
                        type="file"
                        accept=".xlsx, .xls, .csv"
                        onChange={handleExcelFileUpload}
                        className="hidden"
                      />

                      <div
                        onClick={() => excelFileInputRef.current && excelFileInputRef.current.click()}
                        className="border-2 border-dashed border-cyan-500/40 hover:border-cyan-400 bg-slate-950/60 hover:bg-slate-950 rounded-2xl p-8 text-center cursor-pointer transition-all flex flex-col items-center justify-center gap-3"
                      >
                        <div className="h-14 w-14 rounded-2xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center border border-cyan-500/30 text-2xl shadow-glow-cyan">
                          📂
                        </div>
                        <div>
                          <h4 className="font-bold text-white text-sm">
                            설비 엑셀 시리얼 리스트 파일(.xlsx)을 업로드하세요
                          </h4>
                          <p className="text-slate-400 mt-1">
                            클릭하거나 파일을 이곳에 드래그하면, 엑셀 속 모듈 및 품명/세부사항/규격을 자동으로 읽어와 나열합니다.
                          </p>
                        </div>
                        <span className="inline-flex items-center gap-1.5 rounded-xl bg-cyan-500 px-4 py-2 text-xs font-bold text-slate-950 shadow-sm mt-1">
                          <span>📑</span>
                          <span>내 컴퓨터에서 엑셀 파일 선택</span>
                        </span>
                      </div>

                      {isExcelParsing && (
                        <div className="p-4 bg-slate-950 rounded-xl border border-cyan-800 text-center text-cyan-300 animate-pulse">
                          엑셀 시트를 분석하여 부품 목록을 추출하는 중입니다...
                        </div>
                      )}

                      {excelUploadError && (
                        <div className="p-3.5 bg-red-950/60 border border-red-800 rounded-xl text-red-300 flex items-center gap-2">
                          <span className="text-red-400 font-bold">⚠️</span>
                          <span>{excelUploadError}</span>
                        </div>
                      )}

                      {/* Parsed Preview Table */}
                      {parsedExcelParts.length > 0 && (
                        <div className="rounded-2xl border border-emerald-800/80 bg-slate-950/80 overflow-hidden space-y-3 p-4">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <span className="text-emerald-400 font-bold">✓</span>
                              <span className="font-bold text-emerald-300">
                                「{uploadedExcelName}」에서 총 {parsedExcelParts.length}개 부품 품명을 성공적으로 추출했습니다!
                              </span>
                            </div>

                            <button
                              type="button"
                              onClick={() => {
                                const newParts = parsedExcelParts.map(p => ({ ...p, id: generateId(), detectedSerial: "", isVerified: false }));
                                if (step === 2) {
                                  // 2단계: 전체 호기에 엑셀 부품 일괄 복제 배정 & 모델명 자동 채움
                                  const pureName = uploadedExcelName ? uploadedExcelName.replace(/\.[^/.]+$/, "") : "";
                                  const updatedUnits = formProject.equipmentUnits.map(u => ({
                                    ...u,
                                    parts: newParts.map(p => ({ ...p, id: generateId() }))
                                  }));
                                  setFormProject({
                                    ...formProject,
                                    equipmentName: formProject.equipmentName.trim() ? formProject.equipmentName : (pureName || formProject.equipmentName),
                                    equipmentUnits: updatedUnits
                                  });
                                } else {
                                  // 3단계: 현재 호기 부품 교체
                                  const updated = currentProject.equipmentUnits.map(u =>
                                    u.unitIndex === activeUnit ? { ...u, parts: newParts } : u
                                  );
                                  updateCurrentProject({ ...currentProject, equipmentUnits: updated });
                                }
                                setPresetModalOpen(false);
                              }}
                              className="bg-emerald-500 text-slate-950 font-extrabold px-4 py-2 rounded-xl shadow-glow-emerald hover:opacity-95 cursor-pointer flex items-center gap-1.5"
                            >
                              <span>✓</span>
                              <span>이 엑셀 품목 전체를 품명에 나열 (적용)</span>
                            </button>
                          </div>

                          <div className="max-h-56 overflow-y-auto rounded-xl border border-slate-800">
                            <table className="w-full text-left">
                              <thead className="bg-slate-900 text-slate-400 font-semibold sticky top-0">
                                <tr>
                                  <th className="p-2 w-10 text-center">No</th>
                                  <th className="p-2">모듈</th>
                                  <th className="p-2">품명</th>
                                  <th className="p-2">세부 사항</th>
                                  <th className="p-2">규격</th>
                                  <th className="p-2">Serial No.</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-800">
                                {parsedExcelParts.map((p, idx) => (
                                  <tr key={idx} className="hover:bg-slate-900/50">
                                    <td className="p-2 text-center text-slate-500 font-mono font-bold">{idx + 1}</td>
                                    <td className="p-2 text-cyan-300 font-mono text-[11px] font-bold">{p.category}</td>
                                    <td className="p-2 text-slate-200 font-semibold">{p.partName}</td>
                                    <td className="p-2 text-slate-400">{p.subSpec}</td>
                                    <td className="p-2 text-slate-400 font-mono text-[11px]">{p.spec}</td>
                                    <td className="p-2 text-cyan-400 font-mono text-[11px]">{p.detectedSerial || "-"}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>

                {/* Footer */}
                <div className="p-4 border-t border-slate-800 bg-slate-950/60 flex items-center justify-between">
                  <span className="text-slate-500">
                    PJT 양식을 불러오면 언제든지 자유롭게 인라인 수정 및 OCR 스캔을 진행할 수 있습니다.
                  </span>
                  <button
                    onClick={() => {
                      setPresetModalOpen(false);
                      setParsedExcelParts([]);
                      setExcelUploadError(null);
                    }}
                    className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold hover:bg-slate-700 cursor-pointer"
                  >
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ✏️ PJT 양식 추가 / 수정 모달 (Template Editor) */}
          {isTemplateEditorOpen && (
            <div
              className="fixed inset-0 flex items-center justify-center p-3 bg-black/90 backdrop-blur-md"
              style={{ zIndex: 9999 }}
            >
              <div className="relative w-full max-w-3xl rounded-2xl bg-slate-900 border border-cyan-500/50 shadow-2xl overflow-hidden flex flex-col max-h-[88vh]">
                <input
                  ref={editorFileInputRef}
                  type="file"
                  accept=".xlsx, .xls, .csv"
                  onChange={handleEditorExcelUpload}
                  className="hidden"
                />

                {/* Editor Header */}
                <div className="flex items-center justify-between p-4 border-b border-slate-800 bg-slate-950">
                  <div className="flex items-center gap-2.5">
                    <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 text-sm">
                      ✏️
                    </div>
                    <h4 className="text-sm font-bold text-white">
                      {editingTemplateData ? `「${editingTemplateData.modelName}」 양식 수정` : "신규 PJT 양식 추가 등록"}
                    </h4>
                  </div>
                  <button
                    onClick={() => setIsTemplateEditorOpen(false)}
                    className="text-slate-400 hover:text-white p-1 cursor-pointer text-sm"
                  >
                    ✕
                  </button>
                </div>

                {/* Editor Form Body */}
                <div className="flex-1 overflow-y-auto p-4 space-y-4 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-bold mb-1">
                        양식 이름 (모델명) <span className="text-cyan-400">*</span>
                      </label>
                      <input
                        type="text"
                        value={editorModelName}
                        onChange={e => setEditorModelName(e.target.value)}
                        placeholder="예: TM100L (NaVi-TM100L-0312)"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-white placeholder:text-slate-500 focus:border-cyan-500 focus:outline-none"
                      />
                    </div>

                    <div>
                      <label className="block text-slate-300 font-bold mb-1">양식 설명 / 비고</label>
                      <input
                        type="text"
                        value={editorDescription}
                        onChange={e => setEditorDescription(e.target.value)}
                        placeholder="예: 8개 모듈 사내 표준 시리얼 리스트 양식"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 text-white placeholder:text-slate-500 focus:border-cyan-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Parts Toolbar */}
                  <div className="flex items-center justify-between pt-2 border-t border-slate-800">
                    <span className="font-bold text-white">
                      포함 부품 목록 ({editorParts.length}개 품목)
                    </span>

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => editorFileInputRef.current && editorFileInputRef.current.click()}
                        className="bg-cyan-950/80 text-cyan-300 border border-cyan-800/80 px-2.5 py-1.5 rounded-lg font-semibold hover:bg-cyan-900 cursor-pointer flex items-center gap-1 text-[11px]"
                        title="엑셀 파일을 읽어와 부품 리스트를 일괄 채웁니다"
                      >
                        <span>📂</span>
                        <span>엑셀에서 가져오기</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          const curParts = (currentProject && currentProject.equipmentUnits && currentProject.equipmentUnits.find(u => u.unitIndex === activeUnit)?.parts) || [];
                          if (curParts.length > 0) {
                            setEditorParts(curParts.map(p => ({ ...p, id: generateId() })));
                          }
                        }}
                        className="bg-slate-800 text-slate-300 border border-slate-700 px-2.5 py-1.5 rounded-lg font-semibold hover:bg-slate-700 cursor-pointer flex items-center gap-1 text-[11px]"
                      >
                        <span>⚡</span>
                        <span>현재 호기 부품 복사</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          setEditorParts(prev => [
                            ...prev,
                            {
                              id: generateId(),
                              category: prev.length > 0 ? prev[prev.length - 1].category : "[ MAIN ]",
                              partName: "",
                              subSpec: "-",
                              spec: "",
                              detectedSerial: "",
                              isVerified: false
                            }
                          ]);
                        }}
                        className="bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 px-2.5 py-1.5 rounded-lg font-bold hover:bg-cyan-500/30 cursor-pointer flex items-center gap-1 text-[11px]"
                      >
                        <span>+</span>
                        <span>부품 추가</span>
                      </button>
                    </div>
                  </div>

                  {/* Editable Parts Table */}
                  <div className="max-h-60 overflow-y-auto rounded-xl border border-slate-800">
                    <table className="w-full text-left">
                      <thead className="bg-slate-950 text-slate-400 font-semibold sticky top-0 text-[11px]">
                        <tr>
                          <th className="p-2 w-8 text-center">No</th>
                          <th className="p-2 w-28">파트 구분</th>
                          <th className="p-2 min-w-[120px]">품명</th>
                          <th className="p-2 w-24">세부사항</th>
                          <th className="p-2 min-w-[120px]">규격</th>
                          <th className="p-2 w-10 text-center">삭제</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-[11px]">
                        {editorParts.map((p, idx) => (
                          <tr key={p.id || idx} className="hover:bg-slate-900/40">
                            <td className="p-2 text-center text-slate-500 font-mono font-bold">
                              {idx + 1}
                            </td>
                            <td className="p-1">
                              <input
                                type="text"
                                value={p.category || ""}
                                onChange={e => {
                                  const val = e.target.value;
                                  setEditorParts(prev =>
                                    prev.map((item, i) => (i === idx ? { ...item, category: val } : item))
                                  );
                                }}
                                placeholder="[ MAIN ]"
                                className="w-full bg-slate-950 border border-slate-800 rounded p-1 text-cyan-300 font-mono font-bold focus:border-cyan-500 focus:outline-none"
                              />
                            </td>
                            <td className="p-1">
                              <input
                                type="text"
                                value={p.partName || ""}
                                onChange={e => {
                                  const val = e.target.value;
                                  setEditorParts(prev =>
                                    prev.map((item, i) => (i === idx ? { ...item, partName: val } : item))
                                  );
                                }}
                                placeholder="품명 입력"
                                className="w-full bg-slate-950 border border-slate-800 rounded p-1 text-white font-semibold focus:border-cyan-500 focus:outline-none"
                              />
                            </td>
                            <td className="p-1">
                              <input
                                type="text"
                                value={p.subSpec || ""}
                                onChange={e => {
                                  const val = e.target.value;
                                  setEditorParts(prev =>
                                    prev.map((item, i) => (i === idx ? { ...item, subSpec: val } : item))
                                  );
                                }}
                                placeholder="-"
                                className="w-full bg-slate-950 border border-slate-800 rounded p-1 text-slate-300 focus:border-cyan-500 focus:outline-none"
                              />
                            </td>
                            <td className="p-1">
                              <input
                                type="text"
                                value={p.spec || ""}
                                onChange={e => {
                                  const val = e.target.value;
                                  setEditorParts(prev =>
                                    prev.map((item, i) => (i === idx ? { ...item, spec: val } : item))
                                  );
                                }}
                                placeholder="규격 입력"
                                className="w-full bg-slate-950 border border-slate-800 rounded p-1 text-slate-300 font-mono focus:border-cyan-500 focus:outline-none"
                              />
                            </td>
                            <td className="p-1 text-center">
                              <button
                                type="button"
                                onClick={() => {
                                  setEditorParts(prev => prev.filter((_, i) => i !== idx));
                                }}
                                className="text-slate-500 hover:text-red-400 p-1 cursor-pointer text-xs"
                              >
                                ✕
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* Editor Footer */}
                <div className="p-3 border-t border-slate-800 bg-slate-950 flex items-center justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setIsTemplateEditorOpen(false)}
                    className="px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 text-xs hover:bg-slate-700 cursor-pointer"
                  >
                    취소
                  </button>
                  <button
                    type="button"
                    onClick={handleSaveTemplateEditor}
                    className="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 text-xs font-bold shadow-glow-cyan hover:opacity-95 cursor-pointer"
                  >
                    <span>💾</span>
                    <span>양식 저장 완료</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Camera OCR Modal */}
          {ocrModalOpen && targetPart && (
            <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-4 space-y-3 shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-white">📸 {targetPart.partName} 명판 OCR</h3>
                  <button onClick={closeOcr} className="text-slate-400 hover:text-white cursor-pointer">✕</button>
                </div>

                {/* Viewfinder */}
                <div className="relative aspect-[4/3] bg-black rounded-xl overflow-hidden border border-slate-700 flex items-center justify-center">
                  <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                  <div className="absolute inset-0 border-2 border-dashed border-cyan-400/80 m-6 rounded-lg pointer-events-none flex items-center justify-center">
                    <span className="bg-slate-950/80 text-cyan-300 text-[10px] px-2 py-1 rounded">시리얼 각인부를 박스 안에 맞추세요</span>
                    {isOcrProcessing && <div className="absolute inset-x-0 top-0 h-0.5 bg-cyan-400 scan-line" />}
                  </div>
                </div>

                <button
                  onClick={runOcr}
                  disabled={isOcrProcessing}
                  className="w-full bg-gradient-to-r from-cyan-500 to-blue-600 py-3 rounded-xl font-bold text-slate-950 text-xs shadow-glow-cyan cursor-pointer"
                >
                  {isOcrProcessing ? `OCR 분석 중 (${ocrProgress}%)...` : "✨ 프레임 캡처 & 인메모리 시리얼 추출"}
                </button>

                <div>
                  <label className="text-[11px] text-slate-400 block mb-1">인식된 시리얼 번호 (수정 가능):</label>
                  <input
                    type="text"
                    value={ocrCandidate}
                    onChange={e => setOcrCandidate(e.target.value.toUpperCase())}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2 font-mono font-bold text-cyan-300 uppercase"
                  />
                </div>

                <label className="flex items-center gap-2 text-xs text-emerald-400 cursor-pointer">
                  <input type="checkbox" checked={isVerifiedCheck} onChange={e => setIsVerifiedCheck(e.target.checked)} />
                  <span>작업자 실물 검증 완료 (Verified)</span>
                </label>

                <div className="flex gap-2 pt-2">
                  <button onClick={closeOcr} className="w-1/2 bg-slate-800 text-slate-300 py-2 rounded-xl text-xs cursor-pointer">취소</button>
                  <button onClick={saveOcrResult} className="w-1/2 bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-xs shadow-glow-emerald cursor-pointer">저장 및 확정</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
