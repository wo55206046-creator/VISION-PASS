<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="wt-orange-grad" x1="0" y1="24" x2="44" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FF3000"/>
      <stop offset="50%" stopColor="#FF6A00"/>
      <stop offset="100%" stopColor="#FFA200"/>
    </linearGradient>
  </defs>
  
  <!-- Orange Rounded Diamond Symbol -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="26" height="26" rx="5.5" transform="rotate(45 18 8)" fill="url(#wt-orange-grad)"/>
    <!-- Top Inverted Triangle -->
    <polygon points="18,15 14.5,9.5 21.5,9.5" fill="#FFFFFF"/>
    <!-- Inner Stylized W Shape -->
    <path d="M9.5 14 L18 28.5 L26.5 14 L23 14 L18 22.5 L13 14 Z" fill="#FFFFFF"/>
  </g>

  <!-- WITHTECH Official Navy Wordmark -->
  <text x="52" y="32.5" font-family="'Arial Black', 'Impact', 'Pretendard', 'Inter', sans-serif" font-weight="900" font-size="24.5" letter-spacing="-0.8" fill="#003876">
    WITHTECH
  </text>
</svg>
